[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "foundry-agent-workshop"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "azure-ai-projects==2.4.0",
  "azure-identity==1.25.3",
  "openai==2.53.0",
  "python-dotenv==1.2.2",
]

[tool.setuptools.packages.find]
where = ["src"]